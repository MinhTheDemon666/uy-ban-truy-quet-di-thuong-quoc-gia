<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ủy Ban Truy Quét Dị Thường Quốc Gia | Internal Network</title>
<script>if((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4)document.documentElement.classList.add("lite")</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{--green:#8cff9b;--dark-green:#173d25;--bg:#050807;--red:#ff6666;--dim:#607768;--white-green:#d5ffdb;--soft:#a9c7b2}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
body{position:relative;isolation:isolate;background:var(--bg);color:var(--green);font-family:'IBM Plex Mono','Courier New',monospace;font-weight:500;min-height:100vh;overflow:hidden}
body.dead{background:#000;animation:none}
body.dead::before,body.dead .crt-overlay,body.dead .tracking-band,body.dead #static{display:none}
body.busy #stage{pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:900;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.78) 120%);box-shadow:inset 0 0 100px rgba(0,0,0,.75),inset 0 0 25px rgba(0,0,0,.5)}
.crt-overlay{position:fixed;inset:0;z-index:950;pointer-events:none;overflow:hidden}
.crt-overlay::before{content:"";position:absolute;inset:-40px 0 0 0;will-change:transform;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 4px);opacity:.7;animation:drift 12s linear infinite}
.crt-overlay::after{content:"";position:absolute;inset:-5%;will-change:transform;background-image:repeating-radial-gradient(circle at 17% 32%,rgba(255,255,255,.13) 0,transparent 1px,transparent 3px),repeating-radial-gradient(circle at 73% 61%,rgba(140,255,155,.08) 0,transparent 1px,transparent 4px);background-size:5px 5px,7px 7px;opacity:.13;animation:grain .22s steps(3) infinite}
.tracking-band{position:fixed;left:0;top:-30%;width:100%;height:90px;z-index:970;pointer-events:none;opacity:0;background:linear-gradient(to bottom,transparent,rgba(140,255,155,.035) 20%,rgba(255,255,255,.07) 50%,rgba(140,255,155,.035) 80%,transparent);will-change:transform;animation:track 13s linear infinite}
#flick{position:fixed;inset:0;z-index:960;pointer-events:none;background:#000;opacity:0;animation:flickO 7s infinite}
@keyframes flickO{0%,18%,20%,55%,57%,100%{opacity:0}19%{opacity:.03}56%{opacity:.06}82%{opacity:.02}}
body.dead #flick{display:none}
.lite .crt-overlay::after,.lite .tracking-band{display:none}
@keyframes drift{to{transform:translateY(40px)}}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(2%,-2%)}75%{transform:translate(-1%,2%)}100%{transform:translate(1%,-1%)}}
@keyframes track{0%,70%{transform:translateY(0);opacity:0}72%{opacity:.7}76%{transform:translateY(140vh);opacity:.35}77%,100%{transform:translateY(140vh);opacity:0}}

#power{position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:0;background:var(--white-green);box-shadow:0 0 60px 20px rgba(140,255,155,.6)}
#power.on{animation:pon 1s ease-out forwards}
#power.off{animation:poff 1s ease-in forwards}
@keyframes pon{0%{opacity:1;transform:scale(.02,.003)}35%{opacity:1;transform:scale(1,.003)}70%{opacity:1;transform:scale(1,1)}100%{opacity:0;transform:scale(1,1)}}
@keyframes poff{0%{opacity:.9;transform:scale(1,1)}45%{opacity:1;transform:scale(1,.004)}80%{opacity:1;transform:scale(.01,.004)}100%{opacity:0;transform:scale(0,0)}}

#static{position:fixed;inset:0;width:100%;height:100%;z-index:803;pointer-events:none;opacity:0;image-rendering:pixelated}
#syncbar{position:fixed;left:0;top:0;width:100%;height:18vh;z-index:802;pointer-events:none;opacity:0;transform:translateY(-20vh);background:linear-gradient(to bottom,#000 0%,#000 84%,rgba(213,255,219,.5) 94%,rgba(0,0,0,0) 100%)}

#tearLayer{position:fixed;inset:0;pointer-events:none;z-index:800;overflow:hidden}
.ghost{position:absolute;inset:0;overflow:hidden;background:var(--bg);display:none}
.ghost .in{position:absolute;inset:0}
.ghost .in .screen{text-shadow:-4px 0 rgba(255,40,40,.75),4px 0 rgba(40,120,255,.75),0 0 10px rgba(140,255,155,.8)!important}
.stageClone{position:absolute;inset:0}
#glow{position:fixed;top:0;left:0;right:0;will-change:transform;z-index:801;pointer-events:none;display:none;background:linear-gradient(to bottom,rgba(120,255,160,0),rgba(120,255,160,.10) 50%,rgba(120,255,160,0))}

#stage{position:fixed;inset:0;visibility:hidden}
.watermark{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;user-select:none;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(120px,36vw,640px);line-height:1;letter-spacing:.06em;padding-left:.06em;color:rgba(140,255,155,.03)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:25px;text-align:center;text-shadow:0 0 4px rgba(140,255,155,.45),0 0 10px rgba(140,255,155,.15);animation:sig 11s infinite}
.hidden{display:none!important}
@keyframes sig{0%,39%,41%,78%,80%,100%{transform:translateX(0);filter:none}40%{transform:translateX(1px);filter:drop-shadow(-2px 0 rgba(255,0,0,.12)) drop-shadow(2px 0 rgba(0,100,255,.12))}79%{transform:translateX(-1px);filter:drop-shadow(2px 0 rgba(255,0,0,.1)) drop-shadow(-2px 0 rgba(0,100,255,.1))}}

.logo,.question,.exit-message,.access-title{font-family:'Chakra Petch',sans-serif;text-shadow:-2px 0 rgba(255,60,60,.4),2px 0 rgba(70,130,255,.4),0 0 10px rgba(140,255,155,.25)}
.logo{font-size:clamp(20px,4.6vw,40px);font-weight:700;letter-spacing:4px;line-height:1.3}
.question{font-size:clamp(26px,5vw,43px);font-weight:600;color:var(--white-green)}
.top-label,.subtitle,.welcome-label,.field label{font-size:14px;letter-spacing:2px;color:var(--dim)}
.warning,.formerr{font-size:14px;letter-spacing:2px;color:var(--red)}
.description,.exit-subtext{color:var(--soft);font-size:15px;line-height:1.7;max-width:450px}
.employee-question{color:var(--white-green);font-size:16px;line-height:1.8;margin-top:10px}
.loading-label{font-size:15px;margin-top:25px;min-height:1.4em;line-height:1.7}
.loading-bar{width:min(350px,80vw);height:5px;border:1px solid var(--dark-green);padding:1px}
.loading-progress{height:100%;width:0%;background:var(--green);box-shadow:0 0 12px var(--green);transition:width .1s linear}
.loading-percent{font-size:15px;color:var(--dim)}
.button-group{display:flex;gap:18px;margin-top:15px}
button{min-width:130px;padding:13px 25px;background:transparent;border:1px solid var(--green);color:var(--green);font-family:inherit;font-weight:500;font-size:14px;letter-spacing:2px;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:var(--green);color:#000;box-shadow:0 0 20px rgba(140,255,155,.25)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--white-green);outline-offset:5px}
button.danger{border-color:#784343;color:#ff7777}
button.danger:hover:not(:disabled){background:#ff4545;color:#fff;box-shadow:0 0 20px rgba(255,69,69,.3)}
button.back{border-color:#3d5646;color:#8aa593}
.field{display:flex;flex-direction:column;gap:8px;align-items:center}
.field input{width:min(320px,80vw);background:rgba(140,255,155,.04);border:1px solid var(--dark-green);border-bottom:1px solid var(--green);padding:11px 14px;text-align:center;letter-spacing:4px;color:var(--white-green);font-family:inherit;font-weight:500;font-size:17px;outline:none;caret-color:var(--green);text-shadow:0 0 6px rgba(140,255,155,.4)}
.field input:focus{background:rgba(140,255,155,.09);box-shadow:0 0 16px rgba(140,255,155,.15)}
.hint{font-size:14px;letter-spacing:2px;color:var(--green);border:1px dashed var(--dark-green);padding:8px 16px}
.formerr{min-height:1.3em}
.exit-heading{color:var(--red);font-size:14px;letter-spacing:4px}
.exit-message{color:var(--white-green);font-size:clamp(20px,4vw,29px);max-width:550px;line-height:1.6}
.exit-message.err{color:var(--red)}
#access-screen{gap:18px}
.welcome-label{letter-spacing:6px}
.access-title{font-size:clamp(30px,6vw,48px);font-weight:700;letter-spacing:4px;color:var(--white-green);max-width:90vw;word-break:break-word}
.init-block{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity .6s}
.init-block.show{opacity:1}
.init-line{font-size:15px;letter-spacing:2px;color:var(--green)}
.dots{display:inline-block;width:3ch;text-align:left}
.footer{position:fixed;bottom:22px;left:0;width:100%;text-align:center;color:#405348;font-size:11px;letter-spacing:2px;pointer-events:none;z-index:10}

.mtd{position:fixed;z-index:850;pointer-events:none;font-family:'Chakra Petch',monospace;font-weight:500;letter-spacing:3px;color:var(--green);text-shadow:0 0 6px var(--green);opacity:0;user-select:none;animation:mtdF 1s ease-out forwards}
.mtd::before,.mtd::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%}
.mtd::before{color:var(--white-green);clip-path:inset(0 0 50% 0);animation:mtdT 1s steps(3) forwards}
.mtd::after{color:#4dff7a;clip-path:inset(50% 0 0 0);animation:mtdB 1s steps(3) forwards}
@keyframes mtdF{0%{opacity:0}12%{opacity:.95}85%{opacity:.85}100%{opacity:0}}
@keyframes mtdT{0%{transform:translate(0,0)}20%{transform:translate(-3px,-1px) skewX(6deg)}50%{transform:translate(2px,0) skewX(-5deg)}75%{transform:translate(-1px,0)}100%{transform:translate(0,0)}}
@keyframes mtdB{0%{transform:translate(0,0)}20%{transform:translate(3px,1px) skewX(-6deg)}50%{transform:translate(-2px,0) skewX(5deg)}75%{transform:translate(1px,0)}100%{transform:translate(0,0)}}


/* GLOBAL SCROLLBAR CONTROL */
/* Ẩn thanh cuộn trên toàn bộ giao diện, kể cả bản sao glitch */

* {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
}

*::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    background: transparent !important;
}

/* Ẩn nút kéo thay đổi kích thước textarea */
textarea {
    resize: none !important;
}

#investigate-screen {
  gap: 12px;
  padding: 18px;
  overflow-y: auto;
}
.inv-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 15px;
  width: min(94vw, 1040px);
  height: 65vh;
  min-height: 360px;
  text-align: left;
  font-size: 12px;
}
.inv-left {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.inv-panel {
  min-width: 0;
  border: 1px solid var(--dark-green);
  padding: 10px;
  background: rgba(5,8,7,.88);
}
.inv-heading {
  display: block;
  color: var(--white-green);
  font-weight: bold;
  margin-bottom: 7px;
}
.inv-team-panel { flex: 0 0 auto; }
.inv-teams {
  max-height: 175px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  color: var(--soft);
  font-size: 11px;
}
.inv-team-row { line-height: 1.65; }
.inv-dossier-panel {
  flex: 1 0 auto;
  min-height: 180px;
}
.inv-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}
.inv-panel-head .inv-heading { margin: 0; }
.inv-refresh {
  min-width: auto;
  padding: 3px 8px;
  font-size: 10px;
}
.inv-dossiers {
  max-height: 300px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overscroll-behavior: contain;
}
.inv-empty { color: var(--dim); padding: 8px 2px; }
.inv-error { color: var(--red); padding: 8px 2px; }
.inv-list-label {
  font-size: 10px;
  font-weight: bold;
  margin-top: 3px;
}
.open-label { color: var(--red); }
.done-label { color: var(--green); }
.dossier-card {
  width: 100%;
  min-width: 0;
  padding: 7px;
  border: 1px dashed var(--dark-green);
  background: rgba(140,255,155,.025);
  color: var(--soft);
  text-align: left;
  letter-spacing: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dossier-card:hover {
  background: rgba(140,255,155,.09);
  color: var(--white-green);
}
.dossier-card.is-done {
  border-style: solid;
  background: rgba(5,20,10,.4);
}
.dossier-card-title {
  color: var(--white-green);
  font-weight: bold;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.dossier-card.is-done .dossier-card-title {
  color: var(--soft);
  text-decoration: line-through;
}
.dossier-card-meta {
  color: var(--dim);
  font-size: 10px;
  line-height: 1.5;
}
.status-open { color: var(--red); }
.status-done { color: var(--green); }
.dossier-card-hint {
  color: #536c5b;
  font-size: 9px;
  letter-spacing: .4px;
}
.inv-form-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  padding: 14px;
}
.inv-form-title {
  border-bottom: 1px dashed var(--dark-green);
  padding-bottom: 7px;
}
.inv-field {
  align-items: flex-start;
  gap: 6px;
}
.inv-field label {
  font-size: 10px;
  letter-spacing: 1px;
}
.inv-field input,
.inv-field textarea {
  width: 100%;
  max-width: 100%;
  background: rgba(140,255,155,.04);
  border: 1px solid var(--dark-green);
  border-bottom-color: var(--green);
  color: var(--white-green);
  padding: 8px;
  text-align: left;
  letter-spacing: 1px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
.inv-field textarea {
  height: 90px;
  resize: vertical;
}
.inv-submit {
  width: 100%;
  margin-top: auto;
  padding: 9px;
  font-size: 12px;
}
.inv-back { margin-top: 0; }

.dossier-context-menu {
  position: fixed;
  z-index: 1200;
  width: 180px;
  padding: 5px;
  border: 1px solid var(--green);
  background: rgba(3,8,5,.98);
  box-shadow: 0 0 18px rgba(0,0,0,.8), 0 0 12px rgba(140,255,155,.12);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dossier-context-menu button {
  width: 100%;
  min-width: 0;
  padding: 9px 8px;
  text-align: left;
  font-size: 11px;
}
.dossier-modal {
  position: fixed;
  inset: 0;
  z-index: 1190;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,.82);
}
.dossier-modal.hidden { display: none !important; }
.dossier-modal-box {
  width: min(560px, 94vw);
  max-height: 82vh;
  overflow-y: auto;
  border: 1px solid var(--green);
  background: #050b07;
  box-shadow: 0 0 28px rgba(140,255,155,.12);
  padding: 15px;
  text-align: left;
}
.dossier-modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: var(--white-green);
  font-weight: bold;
  letter-spacing: 1px;
  border-bottom: 1px dashed var(--dark-green);
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.inv-modal-close {
  min-width: auto;
  padding: 4px 8px;
  font-size: 10px;
}
.dossier-modal-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--soft);
  font-size: 12px;
}
.detail-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-bottom: 1px solid rgba(23,61,37,.55);
  padding-bottom: 7px;
}
.detail-row span,
.detail-description > span {
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 1px;
}
.detail-row strong {
  color: var(--white-green);
  font-weight: 500;
  overflow-wrap: anywhere;
}
.detail-description p {
  margin-top: 6px;
  color: var(--soft);
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.dossier-modal-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}
.dossier-modal-actions button {
  min-width: 110px;
  padding: 8px 12px;
  font-size: 10px;
}
.inv-edit-label {
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 1px;
}
.inv-edit-input,
.inv-edit-textarea {
  width: 100%;
  background: rgba(140,255,155,.04);
  border: 1px solid var(--dark-green);
  border-bottom-color: var(--green);
  color: var(--white-green);
  padding: 9px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
.inv-edit-textarea {
  min-height: 100px;
  resize: vertical;
}
@media(max-width:760px) {
  #investigate-screen { justify-content: flex-start; }
  .inv-layout {
    grid-template-columns: 1fr;
    height: auto;
    min-height: 0;
  }
  .inv-left { max-height: 46vh; }
  .inv-teams { max-height: 145px; }
  .inv-dossiers { max-height: 230px; }
  .inv-form-panel { min-height: 390px; }
  .inv-back { margin-bottom: 10px; }
}

@media(max-width:480px){.button-group{flex-direction:column;width:min(250px,80vw)}button{width:100%}.access-title{font-size:30px}}
@media(prefers-reduced-motion:reduce){body,#flick,.crt-overlay::before,.crt-overlay::after,.tracking-band,.screen{animation:none!important}}
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div id="flick"></div>
<div class="tracking-band"></div>
<div id="tearLayer"></div>
<div id="glow"></div>
<div id="syncbar"></div>
<canvas id="static"></canvas>
<div id="power"></div>

<div id="stage"><div class="watermark">MTD</div>

<section id="loading-screen" class="screen hidden">
<div class="logo">ỦY BAN TRUY QUÉT<br>DỊ THƯỜNG QUỐC GIA</div>
<div class="subtitle">NATIONAL ANOMALY SWEEP COMMITTEE</div>
<div class="loading-label" id="loading-label">INITIALIZING INTERNAL SYSTEM...</div>
<div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
<div class="loading-percent" id="loading-percent">0%</div>
</section>

<section id="lang-screen" class="screen hidden">
<div class="top-label">LANGUAGE SELECTION / LỰA CHỌN NGÔN NGỮ</div>
<h1 class="question">SELECT LANGUAGE<br>CHỌN NGÔN NGỮ</h1>
<p class="description">Select your language to continue.<br>Chọn ngôn ngữ để tiếp tục.</p>
<div class="button-group"><button id="lang-en">ENGLISH</button><button id="lang-vi">TIẾNG VIỆT</button></div>
</section>

<section id="verify-screen" class="screen hidden">
<div class="top-label" data-i18n="verifyTop"></div>
<div class="warning" data-i18n="restricted"></div>
<h1 class="question" data-i18n="verifyTitle"></h1>
<p class="description" data-i18n="verifyDesc"></p>
<p class="employee-question" data-i18n="verifyQ"></p>
<div class="button-group"><button id="yes-btn" data-i18n="yes"></button><button id="no-btn" class="danger" data-i18n="no"></button></div>
<div class="button-group" style="margin-top:0"><button class="back" data-back data-i18n="ret"></button></div>
</section>

<section id="login-screen" class="screen hidden">
<div class="top-label" data-i18n="loginTop"></div>
<h1 class="question" data-i18n="loginTitle"></h1>
<p class="description" data-i18n="loginDesc"></p>
<div class="field"><label for="name-input" data-i18n="nameLabel"></label><input id="name-input" type="text" maxlength="24" autocomplete="off" spellcheck="false"></div>
<div class="field"><label for="pass-input" data-i18n="passLabel"></label><input id="pass-input" type="password" maxlength="12" autocomplete="off"></div>
<div class="hint" data-i18n="hint"></div>
<div class="formerr" id="form-err"></div>
<div class="button-group" style="margin-top:0"><button id="submit-btn" data-i18n="submit"></button><button class="back" data-back data-i18n="ret"></button></div>
</section>

<section id="exit-screen" class="screen hidden">
<div class="exit-heading" data-i18n="exitHead"></div>
<h2 class="exit-message" id="exit-message"></h2>
<p class="exit-subtext" id="exit-subtext"></p>
<div class="button-group"><button id="disc-btn" class="danger" data-i18n="disc"></button><button class="back" data-back data-i18n="ret"></button></div>
</section>

<section id="access-screen" class="screen hidden">
<div class="welcome-label" data-i18n="welcome"></div>
<h1 class="access-title" id="who"></h1>
<div class="init-block" id="init-block"><div class="init-line"><span data-i18n="initMenu"></span><span class="dots" id="dots"></span></div><div class="subtitle" data-i18n="initSub"></div></div>

function syncContent(now){if(lastSync&&(now-lastSync<250||!dirty))return;const c=buildClone();ghosts.forEach(o=>{o.inner.replaceChildren(c.cloneNode(true))});lastSync=now;dirty=false}
function hideAll(){ghosts.forEach(o=>{o.g.style.display="none"});glow.style.display="none"}
function frame(now){
const vh=innerHeight;
if(!tearEnabled&&band){band=null;hideAll()}
if(!band&&tearEnabled&&!REDUCED){if(now-lastRoll>T.rollEvery){band={mode:"roll",t0:now,dur:T.rollTime,amp:1};lastSync=0}else if(Math.random()<T.burstChance)burst()}

async function transition(swap){
if(busy)return;busy=true;document.body.classList.add("busy");
if(REDUCED){swap();finishFocus();busy=false;document.body.classList.remove("busy");return}
staticOn();
syncbar.animate([{transform:"translateY(-20vh)",opacity:.9},{transform:"translateY(108vh)",opacity:.9}],{duration:OUT+IN*.9,easing:"cubic-bezier(.5,0,.6,1)"});
sc.animate([{opacity:0},{opacity:.5,offset:.4},{opacity:.12,offset:.75},{opacity:0}],{duration:OUT+IN,easing:"linear"});
burst(2.4,OUT+180);
const outA=stage.animate(outKF,{duration:OUT,easing:"ease-in",fill:"forwards"});
await outA.finished;
swap();burst(2,IN*.7);
const inA=stage.animate(inKF,{duration:IN,easing:"ease-out"});
outA.cancel();await inA.finished;
staticOff();busy=false;document.body.classList.remove("busy");finishFocus()}

function degauss(ms){return new Promise(res=>{const t0=performance.now();staticOn();sc.animate([{opacity:.3},{opacity:0}],{duration:ms,easing:"ease-out"});
function step(now){const t=Math.min(1,(now-t0)/ms),d=Math.pow(1-t,2),warm=Math.min(1,t/.3);
const x=Math.sin(t*46)*16*d,y=Math.sin(t*31)*5*d,hue=Math.sin(t*26)*60*d,sk=Math.sin(t*37)*2.2*d,s=1+Math.sin(t*21)*.02*d;
stage.style.transform="translate("+x+"px,"+y+"px) skewX("+sk+"deg) scale("+s+")";
stage.style.filter="hue-rotate("+hue+"deg) blur("+(d*3)+"px) brightness("+(.2+.8*warm+d*.6)+")";
if(t<1)requestAnimationFrame(step);else{stage.style.transform="";stage.style.filter="";staticOff();res()}}
requestAnimationFrame(step)})}

if(!tore&&p>55){tore=true;burst()}
if(p>=100){clearInterval(iv);setTimeout(resolve,700)}} ,65)})}

    boxTeams.innerHTML = teamsData.map(t => {
      const statusText = t.busy ? "[ĐANG THỰC THI NHIỆM VỤ]" : "[ĐANG NGHỈ]";
      const statusColor = t.busy ? "var(--green)" : "var(--dim)";
      return `<div class="inv-team-row">• Đội điều tra ${t.id}: <span style="color:${statusColor};">${statusText}</span></div>`;
    }).join("");
  }

  function updateTeamsIndependent() {
    const currentTime = Date.now();
    let updated = false;

    teamsData.forEach(t => {
      if (currentTime >= t.nextToggle) {
        t.busy = !t.busy;
        t.nextToggle = currentTime + (Math.random() * 40 + 20) * 60 * 1000;
        updated = true;
      }
    });

    if (updated) renderTeams();
  }

  let lastSig = "";
  async function loadFiles() {
    try {
      const r = await fetch(DB_URL);
      if (!r.ok) throw new Error("GET failed");
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error("Invalid database response");
      latestFiles = data;
      const sig = JSON.stringify(data);
      if (sig !== lastSig) { lastSig = sig; renderData(data); }
    } catch (err) {
      lastSig = ""; boxDossiers.innerHTML = `<div class="inv-error">⚠ LỖI KẾT NỐI TỔNG BỘ</div>`;
    }
  }

  function renderData(list) {
    if (!list.length) {
      boxDossiers.innerHTML = `<div class="inv-empty">Chưa có hồ sơ lưu trữ.</div>`;
      return;
    }

    const openList = list.filter(x => x.status === "open");
    const doneList = list.filter(x => x.status === "done");
    const makeCard = (item, done) => `
      <button type="button" class="dossier-card ${done ? "is-done" : ""}" data-id="${escapeHTML(item.id)}">
        <span class="dossier-card-title">[${escapeHTML(item.loc || "Chưa rõ địa điểm")}] ${escapeHTML(item.title || "Hồ sơ không tên")}</span>
        <span class="dossier-card-meta">
          Đặc vụ: ${escapeHTML(item.author || "Ẩn danh")} |
          Trạng thái: <span class="${done ? "status-done" : "status-open"}">${done ? "ĐÃ HOÀN TẤT (DONE)" : "CHƯA XỬ LÝ (OPEN)"}</span>
        </span>
        <span class="dossier-card-hint">CHUỘT TRÁI: XEM CHI TIẾT // CHUỘT PHẢI: TÙY CHỌN</span>
      </button>
    `;

    let html = "";
    if (openList.length) {
      html += `<div class="inv-list-label open-label">--- HỒ SƠ CHƯA XỬ LÝ ---</div>`;
      html += openList.map(item => makeCard(item, false)).join("");
    }
    if (doneList.length) {
      html += `<div class="inv-list-label done-label">--- HỒ SƠ ĐÃ XỬ LÝ ---</div>`;
      html += doneList.map(item => makeCard(item, true)).join("");
    }

    boxDossiers.innerHTML = html;
  }

  function closeContextMenu() {
    contextMenu.classList.add("hidden");
    currentDossier = null;
  }

  function showModal(title, content, actions = []) {
    modalTitle.textContent = title;
    modalContent.innerHTML = content;
    modalActions.replaceChildren();

    actions.forEach(action => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = action.label;
      if (action.className) button.className = action.className;
      button.addEventListener("click", action.onClick);
      modalActions.appendChild(button);
    });

    modal.classList.remove("hidden");
  }

  function closeModal() {
    modal.classList.add("hidden");
    modalContent.replaceChildren();
    modalActions.replaceChildren();
  }

  function findDossier(id) {
    return latestFiles.find(item => String(item.id) === String(id));
  }

  function showDetails(item) {
    if (!item) return;

    const dateText = item.time
      ? new Date(item.time).toLocaleString("vi-VN")
      : "Không có dữ liệu";

    showModal("CHI TIẾT HỒ SƠ", `
      <div class="detail-row"><span>MÃ HỒ SƠ</span><strong>${escapeHTML(item.id)}</strong></div>
      <div class="detail-row"><span>TIÊU ĐỀ / VỤ VIỆC</span><strong>${escapeHTML(item.title)}</strong></div>
      <div class="detail-row"><span>ĐỊA ĐIỂM</span><strong>${escapeHTML(item.loc)}</strong></div>
      <div class="detail-row"><span>NGƯỜI LẬP</span><strong>${escapeHTML(item.author)}</strong></div>
      <div class="detail-row"><span>THỜI GIAN GHI NHẬN</span><strong>${escapeHTML(dateText)}</strong></div>
      <div class="detail-row"><span>TRẠNG THÁI</span><strong>${item.status === "done" ? "ĐÃ HOÀN TẤT" : "CHƯA XỬ LÝ"}</strong></div>
      <div class="detail-description"><span>CHI TIẾT DIỄN BIẾN</span><p>${escapeHTML(item.detail || "Không có nội dung mô tả.")}</p></div>
    `, [
      { label: "ĐÓNG", className: "back", onClick: closeModal }
    ]);
  }

  function editDossier(item) {
    if (!item) return;
    editingDossierId = item.id;

    showModal("CHỈNH SỬA HỒ SƠ", `
      <label class="inv-edit-label">TIÊU ĐỀ / VỤ VIỆC</label>
      <input id="edit-title" class="inv-edit-input" maxlength="60">
      <label class="inv-edit-label">ĐỊA ĐIỂM</label>
      <input id="edit-loc" class="inv-edit-input" maxlength="60">
      <label class="inv-edit-label">CHI TIẾT DIỄN BIẾN</label>
      <textarea id="edit-detail" class="inv-edit-textarea" ></textarea>
      <label class="inv-edit-label">NGƯỜI LẬP</label>
      <input id="edit-author" class="inv-edit-input" maxlength="24">
      <div id="edit-error" class="inv-error"></div>
    `, [
      { label: "LƯU THAY ĐỔI", onClick: saveEdit },
      { label: "HỦY", className: "back", onClick: () => { editingDossierId = null; closeModal(); } }
    ]);

    screenEl.querySelector("#edit-title").value = item.title || "";
    screenEl.querySelector("#edit-loc").value = item.loc || "";
    screenEl.querySelector("#edit-detail").value = item.detail || "";
    screenEl.querySelector("#edit-author").value = item.author || "";
  }

  async function saveEdit() {
    const title = screenEl.querySelector("#edit-title").value.trim();
    const loc = screenEl.querySelector("#edit-loc").value.trim();
    const detail = screenEl.querySelector("#edit-detail").value.trim();
    const author = screenEl.querySelector("#edit-author").value.trim();
    const error = screenEl.querySelector("#edit-error");

    if (!title || !loc) {
      error.textContent = "VUI LÒNG NHẬP TIÊU ĐỀ VÀ ĐỊA ĐIỂM.";
      return;
    }

    const buttons = [...modalActions.querySelectorAll("button")];
    buttons.forEach(button => button.disabled = true);

    try {
      const r = await fetch(DB_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: editingDossierId,
          title,
          loc,
          detail,
          author: author || "Ẩn danh"
        })
      });

      const result = await r.json();
      if (!r.ok || !result.success) {
        throw new Error(result.error || "Không thể cập nhật hồ sơ.");
      }

      closeModal();
      closeContextMenu();
      editingDossierId = null;
      await loadFiles();
    } catch (err) {
      error.textContent = "LỖI: " + (err.message || "KHÔNG THỂ LƯU THAY ĐỔI.");
      buttons.forEach(button => button.disabled = false);
    }
  }

  async function deleteDossier(item) {
    if (!item) return;

    const confirmed = confirm(
      `XÁC NHẬN XÓA HỒ SƠ?\n\n${item.title}\n${item.loc}\n\nHành động này không thể hoàn tác.`
    );

    if (!confirmed) return;

    try {
      const r = await fetch(DB_URL, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id })
      });

      const result = await r.json();
      if (!r.ok || !result.success) {
        throw new Error(result.error || "Không thể xóa hồ sơ.");
      }

      closeContextMenu();
      closeModal();
      await loadFiles();
    } catch (err) {
      alert("LỖI XÓA HỒ SƠ: " + (err.message || "Không thể kết nối tổng bộ."));
    }
  }

  boxDossiers.addEventListener("click", event => {
    const card = event.target.closest(".dossier-card");
    if (!card) return;
    closeContextMenu();
    showDetails(findDossier(card.dataset.id));
  });

  boxDossiers.addEventListener("contextmenu", event => {
    const card = event.target.closest(".dossier-card");
    if (!card) return;

    event.preventDefault();
    const item = findDossier(card.dataset.id);
    if (!item) return;

    currentDossier = item;
    contextMenu.classList.remove("hidden");

    const menuWidth = 180;
    const menuHeight = 94;
    contextMenu.style.left = Math.max(8, Math.min(event.clientX, innerWidth - menuWidth - 8)) + "px";
    contextMenu.style.top = Math.max(8, Math.min(event.clientY, innerHeight - menuHeight - 8)) + "px";
  });

  contextMenu.addEventListener("click", event => {
    const action = event.target.closest("[data-action]")?.dataset.action;
    if (!action || !currentDossier) return;

    const item = currentDossier;
    closeContextMenu();

    if (action === "edit") editDossier(item);
    if (action === "delete") deleteDossier(item);
  });

  screenEl.addEventListener("click", event => {
    if (!event.target.closest("#dossier-context-menu")) closeContextMenu();
  });

  screenEl.querySelector("#dossier-modal-close").addEventListener("click", closeModal);
  modal.addEventListener("click", event => {
    if (event.target === modal) closeModal();
  });

  screenEl.querySelector("#btn-refresh").addEventListener("click", loadFiles);

  screenEl.querySelector("#btn-submit-dossier").addEventListener("click", async () => {
    const title = screenEl.querySelector("#input-title").value.trim();
    const loc = screenEl.querySelector("#input-loc").value.trim();
    const detail = screenEl.querySelector("#input-detail").value.trim();
    const author = screenEl.querySelector("#input-author").value.trim();
    const submitButton = screenEl.querySelector("#btn-submit-dossier");

    if (!title || !loc) {
      alert("Vui lòng nhập ít nhất Tiêu đề vụ việc và Tọa độ/Địa điểm!");
      return;
    }

    submitButton.textContent = "ĐANG ĐẨY LÊN TỔNG BỘ...";
    submitButton.disabled = true;

    try {
      const r = await fetch(DB_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ title, loc, detail, author: author || "Ẩn danh" })
      });

      if (!r.ok) {
        const result = await r.json().catch(() => ({}));
        throw new Error(result.error || "Không thể tạo hồ sơ.");
      }

      screenEl.querySelector("#input-title").value = "";
      screenEl.querySelector("#input-loc").value = "";
      screenEl.querySelector("#input-detail").value = "";
      screenEl.querySelector("#input-author").value = "";
      await loadFiles();
    } catch (err) {
      alert("LỖI KHI GỬI DỮ LIỆU: " + (err.message || "Không thể kết nối tổng bộ."));
    } finally {
      submitButton.textContent = "GỬI LÊN HỆ THỐNG";
      submitButton.disabled = false;
    }
  });

  renderTeams();
  await loadFiles();

  pollInterval = setInterval(() => { if (!document.hidden) loadFiles(); }, 10000);
  teamInterval = setInterval(updateTeamsIndependent, 3000);

  screenEl.querySelector(".back").addEventListener("click", () => {
    clearInterval(pollInterval);
    clearInterval(teamInterval);
    closeContextMenu();
    closeModal();
    screenEl.remove();
    render("dept");
  });
});

function goCustomScreen(screenEl) {
  Object.values(screens).forEach(s => s.classList.add("hidden"));
  screenEl.classList.remove("hidden");
}

$("dept-logistics").addEventListener("click",()=>alert("Đã vào: Cục Hậu Cần"));
$("dept-security").addEventListener("click",()=>alert("Đã vào: Cục Bảo Mật"));

applyLang();boot();
</script>
