<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ủy Ban Truy Quét Dị Thường Quốc Gia | Internal Network</title>
<script>if((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4||/Mobi|Android|iPhone/i.test(navigator.userAgent))document.documentElement.classList.add("lite")</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{--green:#8cff9b;--dark-green:#173d25;--bg:#050807;--red:#ff6666;--dim:#607768;--white-green:#d5ffdb;--soft:#a9c7b2}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
body{position:relative;isolation:isolate;background:var(--bg);color:var(--green);font-family:'IBM Plex Mono','Courier New',monospace;font-weight:500;min-height:100vh;overflow:hidden}
body.dead{background:#000;animation:none}
body.dead::before,body.dead .crt-overlay,body.dead .tracking-band,body.dead #static{display:none}
body.busy #stage{pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:900;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.78) 120%);box-shadow:inset 0 0 100px rgba(0,0,0,.75),inset 0 0 25px rgba(0,0,0,.5)}
.crt-overlay{position:fixed;inset:0;z-index:950;pointer-events:none;overflow:hidden}
.crt-overlay::before{content:"";position:absolute;inset:-40px 0 0 0;will-change:transform;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 4px);opacity:.7;animation:drift 12s linear infinite}
.crt-overlay::after{content:"";position:absolute;inset:-5%;will-change:transform;background-image:repeating-radial-gradient(circle at 17% 32%,rgba(255,255,255,.13) 0,transparent 1px,transparent 3px),repeating-radial-gradient(circle at 73% 61%,rgba(140,255,155,.08) 0,transparent 1px,transparent 4px);background-size:5px 5px,7px 7px;opacity:.13;animation:grain .25s steps(2) infinite}
.tracking-band{position:fixed;left:0;top:-30%;width:100%;height:90px;z-index:970;pointer-events:none;opacity:0;background:linear-gradient(to bottom,transparent,rgba(140,255,155,.035) 20%,rgba(255,255,255,.07) 50%,rgba(140,255,155,.035) 80%,transparent);will-change:transform;animation:track 13s linear infinite}
#flick{position:fixed;inset:0;z-index:960;pointer-events:none;background:#000;opacity:0;animation:flickO 7s infinite}
@keyframes flickO{0%,18%,20%,55%,57%,100%{opacity:0}19%{opacity:.03}56%{opacity:.06}82%{opacity:.02}}
body.dead #flick{display:none}
.lite .crt-overlay::after,.lite .tracking-band,.lite #flick{display:none}
@keyframes drift{to{transform:translateY(40px)}}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(2%,-2%)}100%{transform:translate(-1%,1%)}}
@keyframes track{0%,70%{transform:translateY(0);opacity:0}72%{opacity:.7}76%{transform:translateY(140vh);opacity:.35}77%,100%{transform:translateY(140vh);opacity:0}}

#power{position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:0;background:var(--white-green);box-shadow:0 0 60px 20px rgba(140,255,155,.6)}
#power.on{animation:pon 1s ease-out forwards}
#power.off{animation:poff 1s ease-in forwards}
@keyframes pon{0%{opacity:1;transform:scale(.02,.003)}35%{opacity:1;transform:scale(1,.003)}70%{opacity:1;transform:scale(1,1)}100%{opacity:0;transform:scale(1,1)}}
@keyframes poff{0%{opacity:.9;transform:scale(1,1)}45%{opacity:1;transform:scale(1,.004)}80%{opacity:1;transform:scale(.01,.004)}100%{opacity:0;transform:scale(0,0)}}

#static{position:fixed;inset:0;width:100%;height:100%;z-index:803;pointer-events:none;opacity:0;image-rendering:pixelated}
#syncbar{position:fixed;left:0;top:0;width:100%;height:18vh;z-index:802;pointer-events:none;opacity:0;transform:translateY(-20vh);background:linear-gradient(to bottom,#000 0%,#000 84%,rgba(213,255,219,.5) 94%,rgba(0,0,0,0) 100%)}

#tearLayer{position:fixed;inset:0;pointer-events:none;z-index:800;overflow:hidden}
.ghost{position:absolute;inset:0;overflow:hidden;background:var(--bg);display:none;will-change:transform,clip-path}
.ghost .in{position:absolute;inset:0;will-change:transform}
.ghost .in .screen{text-shadow:-4px 0 rgba(255,40,40,.75),4px 0 rgba(40,120,255,.75),0 0 10px rgba(140,255,155,.8)!important}
.stageClone{position:absolute;inset:0}
#glow{position:fixed;top:0;left:0;right:0;will-change:transform;z-index:801;pointer-events:none;display:none;background:linear-gradient(to bottom,rgba(120,255,160,0),rgba(120,255,160,.10) 50%,rgba(120,255,160,0))}

#stage{position:fixed;inset:0;visibility:hidden}
.watermark{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;user-select:none;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(120px,36vw,640px);line-height:1;letter-spacing:.06em;padding-left:.06em;color:rgba(140,255,155,.03)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:25px;text-align:center;text-shadow:0 0 4px rgba(140,255,155,.45),0 0 10px rgba(140,255,155,.15);animation:sig 11s infinite}
.lite .screen{animation:none}
.hidden{display:none!important}
@keyframes sig{0%,39%,41%,78%,80%,100%{transform:translateX(0);filter:none}40%{transform:translateX(1px);filter:drop-shadow(-2px 0 rgba(255,0,0,.12)) drop-shadow(2px 0 rgba(0,100,255,.12))}79%{transform:translateX(-1px);filter:drop-shadow(2px 0 rgba(255,0,0,.1)) drop-shadow(-2px 0 rgba(0,100,255,.1))}}

.logo,.question,.exit-message,.access-title{font-family:'Chakra Petch',sans-serif;text-shadow:-2px 0 rgba(255,60,60,.4),2px 0 rgba(70,130,255,.4),0 0 10px rgba(140,255,155,.25)}
.logo{font-size:clamp(20px,4.6vw,40px);font-weight:700;letter-spacing:4px;line-height:1.3}
.question{font-size:clamp(26px,5vw,43px);font-weight:600;color:var(--white-green)}
.top-label,.subtitle,.welcome-label,.field label{font-size:14px;letter-spacing:2px;color:var(--dim)}
.warning,.formerr{font-size:14px;letter-spacing:2px;color:var(--red)}
.description,.exit-subtext{color:var(--soft);font-size:15px;line-height:1.7;max-width:450px}
.employee-question{color:var(--white-green);font-size:16px;line-height:1.8;margin-top:10px}
.loading-label{font-size:15px;margin-top:25px;min-height:1.4em;line-height:1.7}
.loading-bar{width:min(350px,80vw);height:5px;border:1px solid var(--dark-green);padding:1px}
.loading-progress{height:100%;width:0%;background:var(--green);box-shadow:0 0 12px var(--green);transition:width .1s linear}
.loading-percent{font-size:15px;color:var(--dim)}
.button-group{display:flex;gap:18px;margin-top:15px}
button{min-width:130px;padding:13px 25px;background:transparent;border:1px solid var(--green);color:var(--green);font-family:inherit;font-weight:500;font-size:14px;letter-spacing:2px;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:var(--green);color:#000;box-shadow:0 0 20px rgba(140,255,155,.25)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--white-green);outline-offset:5px}
button.danger{border-color:#784343;color:#ff7777}
button.danger:hover:not(:disabled){background:#ff4545;color:#fff;box-shadow:0 0 20px rgba(255,69,69,.3)}
button.back{border-color:#3d5646;color:#8aa593}
.field{display:flex;flex-direction:column;gap:8px;align-items:center}
.field input{width:min(320px,80vw);background:rgba(140,255,155,.04);border:1px solid var(--dark-green);border-bottom:1px solid var(--green);padding:11px 14px;text-align:center;letter-spacing:4px;color:var(--white-green);font-family:inherit;font-weight:500;font-size:17px;outline:none;caret-color:var(--green);text-shadow:0 0 6px rgba(140,255,155,.4)}
.field input:focus{background:rgba(140,255,155,.09);box-shadow:0 0 16px rgba(140,255,155,.15)}
.hint{font-size:14px;letter-spacing:2px;color:var(--green);border:1px dashed var(--dark-green);padding:8px 16px}
.formerr{min-height:1.3em}
.exit-heading{color:var(--red);font-size:14px;letter-spacing:4px}
.exit-message{color:var(--white-green);font-size:clamp(20px,4vw,29px);max-width:550px;line-height:1.6}
.exit-message.err{color:var(--red)}
#access-screen{gap:18px}
.welcome-label{letter-spacing:6px}
.access-title{font-size:clamp(30px,6vw,48px);font-weight:700;letter-spacing:4px;color:var(--white-green);max-width:90vw;word-break:break-word}
.init-block{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity .6s}
.init-block.show{opacity:1}
.init-line{font-size:15px;letter-spacing:2px;color:var(--green)}
.dots{display:inline-block;width:3ch;text-align:left}
.footer{position:fixed;bottom:22px;left:0;width:100%;text-align:center;color:#405348;font-size:11px;letter-spacing:2px;pointer-events:none;z-index:10}

.mtd{position:fixed;z-index:850;pointer-events:none;font-family:'Chakra Petch',monospace;font-weight:500;letter-spacing:3px;color:var(--green);text-shadow:0 0 6px var(--green);opacity:0;user-select:none;animation:mtdF .9s ease-out forwards}
@keyframes mtdF{0%{opacity:0;transform:translateX(-2px)}20%{opacity:.9;transform:translateX(2px)}80%{opacity:.7;transform:translateX(0)}100%{opacity:0}}

* {
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
}
*::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    background: transparent !important;
}
textarea { resize: none !important; }

/* ========================================================== */
/* GIAO DIỆN CỤC ĐIỀU TRA (TỐI ƯU HIỆU NĂNG)                  */
/* ========================================================== */
#investigate-screen {
  gap: 12px;
  padding: 16px;
  overflow-y: auto;
  justify-content: flex-start;
}

.inv-container {
  display: flex;
  flex-direction: column;
  gap: 0;
  width: min(94vw, 1080px);
  height: 72vh;
  text-align: left;
  font-size: 12px;
}

.inv-top-bar {
  display: flex;
  align-items: stretch;
  gap: 12px;
  border: 1px solid var(--dark-green);
  background: rgba(5,8,7,.92);
  padding: 10px;
  height: 165px;
  min-height: 62px;
  max-height: 54vh;
  flex-shrink: 0;
  overflow: hidden;
}

.inv-team-section {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.inv-heading {
  display: block;
  color: var(--white-green);
  font-weight: bold;
  margin-bottom: 6px;
  flex-shrink: 0;
}

.inv-teams {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 4px 12px;
  color: var(--soft);
  font-size: 11px;
  contain: content;
}
.inv-team-row { line-height: 1.5; }

.inv-resizer {
  height: 14px;
  margin: 2px 0;
  cursor: ns-resize;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: none;
  position: relative;
}
.inv-resizer::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  border-top: 1px dashed var(--dark-green);
  transition: border-color .15s;
}
.inv-resizer span {
  position: relative;
  z-index: 1;
  background: var(--bg);
  padding: 0 12px;
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 3px;
}
.inv-resizer:hover::before,
.inv-resizer.dragging::before {
  border-top: 1px solid var(--green);
}
.inv-resizer:hover span,
.inv-resizer.dragging span {
  color: var(--white-green);
}

.inv-add-btn-box {
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px dashed var(--dark-green);
  padding-left: 15px;
  flex-shrink: 0;
}

.inv-plus-btn {
  width: 50px;
  height: 50px;
  min-width: unset;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  border: 1px dashed var(--green);
  background: rgba(140,255,155,.05);
  color: var(--green);
  cursor: pointer;
  transition: .2s;
}
.inv-plus-btn:hover {
  background: var(--green);
  color: #000;
}

.inv-panel {
  flex: 1;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--dark-green);
  padding: 10px;
  background: rgba(5,8,7,.92);
  overflow: hidden;
}

.inv-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  flex-shrink: 0;
}
.inv-panel-head .inv-heading { margin: 0; }
.inv-refresh {
  min-width: auto;
  padding: 3px 8px;
  font-size: 10px;
}

.inv-dossiers {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overscroll-behavior: contain;
  padding-right: 4px;
  contain: content;
}

.inv-empty { color: var(--dim); padding: 8px 2px; }
.inv-error { color: var(--red); padding: 8px 2px; }
.inv-list-label {
  font-size: 10px;
  font-weight: bold;
  margin-top: 4px;
  letter-spacing: 1px;
}
.open-label { color: var(--red); }
.done-label { color: var(--green); }

.dossier-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 8px;
}

.dossier-card {
  width: 100%;
  min-width: 0;
  padding: 8px 10px;
  border: 1px dashed var(--dark-green);
  background: rgba(140,255,155,.025);
  color: var(--soft);
  text-align: left;
  letter-spacing: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.dossier-card:hover {
  background: rgba(140,255,155,.09);
  color: var(--white-green);
  border-color: var(--green);
}
.dossier-card.is-done {
  border-style: solid;
  background: rgba(5,20,10,.4);
}
.dossier-card-title {
  color: var(--white-green);
  font-weight: bold;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.dossier-card.is-done .dossier-card-title {
  color: var(--soft);
  text-decoration: line-through;
}
.dossier-card-meta {
  color: var(--dim);
  font-size: 10px;
  line-height: 1.4;
}
.status-open { color: var(--red); }
.status-done { color: var(--green); }
.dossier-card-hint {
  color: #536c5b;
  font-size: 9px;
  letter-spacing: .4px;
}

.dossier-modal {
  position: fixed;
  inset: 0;
  z-index: 1190;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,.85);
}
.dossier-modal.hidden { display: none !important; }
.dossier-modal-box {
  width: min(560px, 94vw);
  max-height: 86vh;
  overflow-y: auto;
  border: 1px solid var(--green);
  background: #050b07;
  padding: 16px;
  text-align: left;
}
.dossier-modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: var(--white-green);
  font-weight: bold;
  letter-spacing: 1px;
  border-bottom: 1px dashed var(--dark-green);
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.inv-modal-close {
  min-width: auto;
  padding: 4px 8px;
  font-size: 10px;
}
.dossier-modal-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--soft);
  font-size: 12px;
}
.detail-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-bottom: 1px solid rgba(23,61,37,.55);
  padding-bottom: 7px;
}
.detail-row span,
.detail-description > span {
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 1px;
}
.detail-row strong {
  color: var(--white-green);
  font-weight: 500;
  overflow-wrap: anywhere;
}
.detail-description p {
  margin-top: 6px;
  color: var(--soft);
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.dossier-modal-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}
.dossier-modal-actions button {
  min-width: 110px;
  padding: 8px 12px;
  font-size: 10px;
}

.inv-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: flex-start;
  width: 100%;
}
.inv-field label {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--dim);
}
.inv-field input,
.inv-field textarea,
.inv-edit-input,
.inv-edit-textarea {
  width: 100%;
  max-width: 100%;
  background: rgba(140,255,155,.04);
  border: 1px solid var(--dark-green);
  border-bottom-color: var(--green);
  color: var(--white-green);
  padding: 9px;
  text-align: left;
  letter-spacing: 1px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}
.inv-field textarea,
.inv-edit-textarea {
  min-height: 110px;
  resize: vertical;
}
.inv-edit-label {
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 1px;
  display: block;
  margin-top: 6px;
}

.dossier-context-menu {
  position: fixed;
  z-index: 1200;
  width: 180px;
  padding: 5px;
  border: 1px solid var(--green);
  background: rgba(3,8,5,.98);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dossier-context-menu button {
  width: 100%;
  min-width: 0;
  padding: 9px 8px;
  text-align: left;
  font-size: 11px;
}

.inv-back { margin-top: 4px; }

@media(max-width:760px) {
  .inv-top-bar { flex-direction: column; }
  .inv-teams { max-height: 130px; }
  .inv-add-btn-box { border-left: none; border-top: 1px dashed var(--dark-green); padding-left: 0; padding-top: 10px; justify-content: flex-start; }
}
@media(max-width:480px){.button-group{flex-direction:column;width:min(250px,80vw)}button{width:100%}.access-title{font-size:30px}}
@media(prefers-reduced-motion:reduce){body,#flick,.crt-overlay::before,.crt-overlay::after,.tracking-band,.screen{animation:none!important}}
</style>
</head>
<body>
<div class="crt-overlay"></div>
<div id="flick"></div>
<div class="tracking-band"></div>
<div id="tearLayer"></div>
<div id="glow"></div>
<div id="syncbar"></div>
<canvas id="static"></canvas>
<div id="power"></div>

<div id="stage"><div class="watermark">MTD</div>

<section id="loading-screen" class="screen hidden">
<div class="logo">ỦY BAN TRUY QUÉT<br>DỊ THƯỜNG QUỐC GIA</div>
<div class="subtitle">NATIONAL ANOMALY SWEEP COMMITTEE</div>
<div class="loading-label" id="loading-label">INITIALIZING INTERNAL SYSTEM...</div>
<div class="loading-bar"><div class="loading-progress" id="loading-progress"></div></div>
<div class="loading-percent" id="loading-percent">0%</div>
</section>

<section id="lang-screen" class="screen hidden">
<div class="top-label">LANGUAGE SELECTION / LỰA CHỌN NGÔN NGỮ</div>
<h1 class="question">SELECT LANGUAGE<br>CHỌN NGÔN NGỮ</h1>
<p class="description">Select your language to continue.<br>Chọn ngôn ngữ để tiếp tục.</p>
<div class="button-group"><button id="lang-en">ENGLISH</button><button id="lang-vi">TIẾNG VIỆT</button></div>
</section>

<section id="verify-screen" class="screen hidden">
<div class="top-label" data-i18n="verifyTop"></div>
<div class="warning" data-i18n="restricted"></div>
<h1 class="question" data-i18n="verifyTitle"></h1>
<p class="description" data-i18n="verifyDesc"></p>
<p class="employee-question" data-i18n="verifyQ"></p>
<div class="button-group"><button id="yes-btn" data-i18n="yes"></button><button id="no-btn" class="danger" data-i18n="no"></button></div>
<div class="button-group" style="margin-top:0"><button class="back" data-back data-i18n="ret"></button></div>
</section>

<section id="login-screen" class="screen hidden">
<div class="top-label" data-i18n="loginTop"></div>
<h1 class="question" data-i18n="loginTitle"></h1>
<p class="description" data-i18n="loginDesc"></p>
<div class="field"><label for="name-input" data-i18n="nameLabel"></label><input id="name-input" type="text" maxlength="24" autocomplete="off" spellcheck="false"></div>
<div class="field"><label for="pass-input" data-i18n="passLabel"></label><input id="pass-input" type="password" maxlength="12" autocomplete="off"></div>
<div class="hint" data-i18n="hint"></div>
<div class="formerr" id="form-err"></div>
<div class="button-group" style="margin-top:0"><button id="submit-btn" data-i18n="submit"></button><button class="back" data-back data-i18n="ret"></button></div>
</section>

<section id="exit-screen" class="screen hidden">
<div class="exit-heading" data-i18n="exitHead"></div>

exitsNo:[{m:"Bạn không thuộc phạm vi nhân sự được cấp quyền truy cập.",s:"Thiết bị này chỉ dành cho nhân viên đã đăng ký.<br>Kết nối của bạn đã được ghi nhận."},{m:"Bạn đã quay lại.",s:"Thiết bị này không trả lời câu hỏi.<br>Xin hãy ngắt kết nối."},{m:"Chúng tôi thấy bạn vẫn còn ở đây.",s:"Trễ rồi. Bạn nên đi ngủ.<br>Xin hãy ngắt kết nối."}],
exitsPass:[{m:"Thông tin xác thực không hợp lệ.",s:"Dữ liệu bạn cung cấp không khớp với hồ sơ của chúng tôi.<br>Lần thử của bạn đã được ghi nhận."},{m:"Vẫn chưa đúng.",s:"Thiết bị này không tha thứ cho lần sai thứ hai.<br>Xin hãy ngắt kết nối."},{m:"Dù bạn là ai, bạn không nên ở đây.",s:"Trễ rồi. Bạn nên đi ngủ.<br>Xin hãy ngắt kết nối."}],
deptTop:"PHÂN CÔNG CỤC",deptTitle:"CHỌN ĐƠN VỊ TRỰC THUỘC",deptDesc:"Xác định cục chuyên trách của bạn trong Ủy Ban.",dept1:"1. CỤC XỬ LÝ",dept2:"2. CỤC ĐIỀU TRA",dept3:"3. CỤC HẬU CẦN",dept4:"4. CỤC BẢO MẬT"}};

const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage=$("stage"),power=$("power"),tearLayer=$("tearLayer"),glow=$("glow"),sc=$("static"),syncbar=$("syncbar");

function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=tr(el.dataset.i18n)})}

// Canvas nhiễu tĩnh độ phân giải thấp để siêu nhẹ
const sx=sc.getContext("2d",{alpha:false});sc.width=160;sc.height=90;
const noiseFrames=[];for(let k=0;k<4;k++){const img=sx.createImageData(160,90),d=img.data;for(let y=0;y<90;y++){const bias=Math.random()<.09?140+Math.random()*115:Math.random()*60;for(let x=0;x<160;x++){const v=Math.min(255,Math.random()*120+bias*Math.random()),i=(y*160+x)*4;d[i]=v*.55;d[i+1]=v;d[i+2]=v*.65;d[i+3]=255}}noiseFrames.push(img)}let nfi=0;function paintStatic(){sx.putImageData(noiseFrames[nfi++%4],0,0)}
let staticTimer=null;
function staticOn(){if(!staticTimer){paintStatic();staticTimer=setInterval(paintStatic,80)}}
function staticOff(){clearInterval(staticTimer);staticTimer=null}

// Hệ thống Glitch chỉ chạy rAF khi đang nhiễu (không chạy ngầm lúc rảnh)
tearLayer.inert=true;
const ghosts=[];
for(let i=0;i<T.slices;i++){const g=document.createElement("div");g.className="ghost";const inner=document.createElement("div");inner.className="in";g.appendChild(inner);tearLayer.appendChild(g);ghosts.push({g,inner})}
let band=null,lastSync=0,tearEnabled=false,rafId=null,idleTimer=null,dirty=true;

function buildClone(){
  const c=stage.cloneNode(true);
  c.removeAttribute("id");c.className="stageClone";c.style.cssText="";
  c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  c.querySelectorAll(".screen").forEach(s=>{s.style.animation="none"});
  c.querySelectorAll(".watermark").forEach(e=>e.remove());
  return c;
}
new MutationObserver(()=>{dirty=true}).observe(stage,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["class"]});

function syncContent(now){
  if(lastSync&&(now-lastSync<450||!dirty))return;
  const c=buildClone();
  ghosts.forEach(o=>{o.inner.replaceChildren(c.cloneNode(true))});
  lastSync=now;dirty=false;
}
function hideAll(){ghosts.forEach(o=>{o.g.style.display="none"});glow.style.display="none"}

function renderBand(now){
  if(!band||!tearEnabled||pauseGlitch){band=null;hideAll();rafId=null;return}
  const vh=innerHeight,p=(now-band.t0)/band.dur;
  if(p>=1){band=null;hideAll();rafId=null;return}
  syncContent(now);
  const y=band.mode==="roll"?-T.bandH+(vh+T.bandH)*p:band.y,sh=T.bandH/T.slices;
  ghosts.forEach((o,i)=>{
    const top=y+i*sh,clipTop=Math.max(0,top),clipBottom=Math.max(0,vh-(top+sh));
    const env=Math.sin(Math.PI*(i+.5)/T.slices);
    const dx=env*T.maxShift*band.amp*(Math.sin(now/60+i*1.7)*.7+(Math.random()-.5)*.8);
    o.g.style.display="block";
    o.g.style.clipPath=`inset(${clipTop}px 0 ${clipBottom}px 0)`;
    o.inner.style.transform=`translateX(${dx}px)`;
  });
  glow.style.display="block";glow.style.transform=`translateY(${y}px)`;glow.style.height=T.bandH+"px";
  rafId=requestAnimationFrame(renderBand);
}

function startBand(newBand){
  if(REDUCED||!tearEnabled||pauseGlitch||document.hidden)return;
  band=newBand;lastSync=0;
  if(!rafId)rafId=requestAnimationFrame(renderBand);
}

function burst(amp=1.8,dur){
  if(REDUCED||!tearEnabled||pauseGlitch)return;
  spawnMTD();
  startBand({mode:"burst",t0:performance.now(),dur:dur||(240+Math.random()*280),y:Math.random()*innerHeight*.8,amp});
}
window.tearBurst=burst;

// Bộ đếm thời gian sọc cuộn định kỳ (tiết kiệm CPU gấp 10 lần so với chạy rAF liên tục)
idleTimer=setInterval(()=>{
  if(!tearEnabled||REDUCED||pauseGlitch||band||document.hidden)return;
  if(Math.random()<.35)startBand({mode:"roll",t0:performance.now(),dur:T.rollTime,amp:1});
  else if(Math.random()<.45)burst(1.4,260);
},4500);

const OUT=360,IN=520;
const F=(b,bl,x)=>`brightness(${b}) blur(${bl}px) drop-shadow(${-x}px 0 rgba(255,0,0,.55)) drop-shadow(${x}px 0 rgba(0,110,255,.55))`;
const outKF=[{transform:"translate(0,0) skewX(0deg) scaleY(1)",filter:F(1,0,0),opacity:1},{transform:"translate(-7px,0) skewX(2deg) scaleY(1)",filter:F(1.4,0,4),opacity:1,offset:.3},{transform:"translate(9px,5vh) skewX(-4deg) scaleY(.98)",filter:F(1.9,1,8),opacity:.9,offset:.65},{transform:"translate(-4px,16vh) skewX(3deg) scaleY(.9)",filter:F(2.6,3,12),opacity:.25}];
const inKF=[{transform:"translate(6px,-16vh) skewX(-3deg) scaleY(1.08)",filter:F(2.4,3,12),opacity:.25},{transform:"translate(-6px,4vh) skewX(3deg) scaleY(1.02)",filter:F(1.6,1,7),opacity:.8,offset:.35},{transform:"translate(3px,-1.5vh) skewX(-1deg) scaleY(1)",filter:F(1.2,0,3),opacity:1,offset:.65},{transform:"translate(0,0) skewX(0deg) scaleY(1)",filter:F(1,0,0),opacity:1}];

async function transition(swap){
  if(busy)return;busy=true;document.body.classList.add("busy");
  if(REDUCED){swap();finishFocus();busy=false;document.body.classList.remove("busy");return}
  staticOn();
  syncbar.animate([{transform:"translateY(-20vh)",opacity:.9},{transform:"translateY(108vh)",opacity:.9}],{duration:OUT+IN*.9,easing:"cubic-bezier(.5,0,.6,1)"});
  sc.animate([{opacity:0},{opacity:.5,offset:.4},{opacity:.12,offset:.75},{opacity:0}],{duration:OUT+IN,easing:"linear"});
  burst(2.2,OUT+160);
  const outA=stage.animate(outKF,{duration:OUT,easing:"ease-in",fill:"forwards"});
  await outA.finished;
  swap();burst(1.8,IN*.65);
  const inA=stage.animate(inKF,{duration:IN,easing:"ease-out"});
  outA.cancel();await inA.finished;
  staticOff();busy=false;document.body.classList.remove("busy");finishFocus();
}
function finishFocus(){const el=current&&screens[current].querySelector("input, button");if(el)el.focus({preventScroll:true})}

let welcomeTimers=[];

function render(name){Object.values(screens).forEach(s=>s.classList.add("hidden"));screens[name].classList.remove("hidden");current=name;if(name==="login"){passInput.value="";formErr.textContent=""}if(name==="access")startWelcome();else stopWelcome()}
function go(name,prep){return transition(()=>{if(prep)prep();history.push(name);render(name)})}
function back(){
  if(busy||history.length<2)return;
  return transition(()=>{
    if(current==="dept")history.pop();
    history.pop();
    render(history[history.length-1]);

document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",back));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!busy&&history.length>1&&screens[current].querySelector("[data-back]"))back()});

function degauss(ms){return new Promise(res=>{const t0=performance.now();staticOn();sc.animate([{opacity:.3},{opacity:0}],{duration:ms,easing:"ease-out"});
function step(now){const t=Math.min(1,(now-t0)/ms),d=Math.pow(1-t,2),warm=Math.min(1,t/.3);
const x=Math.sin(t*46)*16*d,y=Math.sin(t*31)*5*d,hue=Math.sin(t*26)*60*d,sk=Math.sin(t*37)*2.2*d,s=1+Math.sin(t*21)*.02*d;
stage.style.transform=`translate(${x}px,${y}px) skewX(${sk}deg) scale(${s})`;
stage.style.filter=`hue-rotate(${hue}deg) blur(${d*3}px) brightness(${.2+.8*warm+d*.6})`;
if(t<1)requestAnimationFrame(step);else{stage.style.transform="";stage.style.filter="";staticOff();res()}}
requestAnimationFrame(step)})}

function runLoading(){return new Promise(resolve=>{const bar=$("loading-progress"),pct=$("loading-percent"),label=$("loading-label");let p=0,tore=false;
const iv=setInterval(()=>{p=Math.min(100,p+Math.floor(Math.random()*4)+1);bar.style.width=p+"%";pct.textContent=p+"%";
const m=LOADING_MSGS[Math.min(Math.floor(p/21),LOADING_MSGS.length-1)];label.textContent=m[0];label.style.color=m[1]||"";
if(!tore&&p>55){tore=true;burst()}
if(p>=100){clearInterval(iv);setTimeout(resolve,700)}} ,65)})}

    pauseGlitch = false;
    resizer.classList.remove("dragging");
    document.body.style.cursor = "";
  };

  resizer.addEventListener("mousedown", startResize);
  resizer.addEventListener("touchstart", startResize, { passive: false });
  window.addEventListener("mousemove", doResize);
  window.addEventListener("touchmove", doResize, { passive: false });
  window.addEventListener("mouseup", stopResize);
  window.addEventListener("touchend", stopResize);

  const boxTeams = screenEl.querySelector("#box-teams");
  const boxDossiers = screenEl.querySelector("#box-dossiers");
  const contextMenu = screenEl.querySelector("#dossier-context-menu");
  const modal = screenEl.querySelector("#dossier-modal");
  const modalTitle = screenEl.querySelector("#dossier-modal-title");
  const modalContent = screenEl.querySelector("#dossier-modal-content");
  const modalActions = screenEl.querySelector("#dossier-modal-actions");

  let pollInterval = null;
  let teamInterval = null;
  let currentDossier = null;
  let editingDossierId = null;
  let latestFiles = [];

  const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));

  // Khởi tạo 36 đội một lần duy nhất & chỉ cập nhật đúng đội thay đổi trạng thái
  const teamsData = [];
  const now = Date.now();
  for (let i = 1; i <= 36; i++) {
    teamsData.push({
      id: String(i).padStart(2, "0"),
      busy: Math.random() < 0.5,
      nextToggle: now + (Math.random() * 40 + 15) * 60 * 1000
    });
  }

  function initTeamsDOM() {
    boxTeams.innerHTML = teamsData.map(t => {
      const statusText = t.busy ? "[ĐANG THỰC THI]" : "[ĐANG NGHỈ]";
      const statusColor = t.busy ? "var(--green)" : "var(--dim)";
      return `<div class="inv-team-row">• Đội ${t.id}: <span id="team-st-${t.id}" style="color:${statusColor};">${statusText}</span></div>`;
    }).join("");
  }

  function updateTeamsIndependent() {
    if (document.hidden) return;
    const currentTime = Date.now();
    teamsData.forEach(t => {
      if (currentTime >= t.nextToggle) {
        t.busy = !t.busy;
        t.nextToggle = currentTime + (Math.random() * 40 + 20) * 60 * 1000;
        const span = screenEl.querySelector(`#team-st-${t.id}`);
        if (span) {
          span.textContent = t.busy ? "[ĐANG THỰC THI]" : "[ĐANG NGHỈ]";
          span.style.color = t.busy ? "var(--green)" : "var(--dim)";
        }
      }
    });
  }

  let lastSig = "";
  async function loadFiles() {
    try {
      const r = await fetch(DB_URL);
      if (!r.ok) throw new Error("GET failed");
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error("Invalid database response");
      latestFiles = data;
      const sig = JSON.stringify(data);
      if (sig !== lastSig) { lastSig = sig; renderData(data); }
    } catch (err) {
      lastSig = ""; boxDossiers.innerHTML = `<div class="inv-error">⚠ LỖI KẾT NỐI TỔNG BỘ</div>`;
    }
  }

  function renderData(list) {
    if (!list.length) {
      boxDossiers.innerHTML = `<div class="inv-empty">Chưa có hồ sơ lưu trữ. Bấm dấu cộng (+) phía trên để lập hồ sơ mới.</div>`;
      return;
    }

    const openList = list.filter(x => x.status === "open");
    const doneList = list.filter(x => x.status === "done");
    
    const makeCard = (item, done) => `
      <button type="button" class="dossier-card ${done ? "is-done" : ""}" data-id="${escapeHTML(item.id)}">
        <span class="dossier-card-title">[${escapeHTML(item.loc || "Chưa rõ")}] ${escapeHTML(item.title || "Hồ sơ không tên")}</span>
        <span class="dossier-card-meta">
          Đặc vụ: ${escapeHTML(item.author || "Ẩn danh")} | 
          Trạng thái: <span class="${done ? "status-done" : "status-open"}">${done ? "DONE" : "OPEN"}</span>
        </span>
        <span class="dossier-card-hint">CHUỘT TRÁI: XEM // CHUỘT PHẢI: TÙY CHỌN</span>
      </button>
    `;

    let html = "";
    if (openList.length) {
      html += `<div class="inv-list-label open-label">--- HỒ SƠ CHƯA XỬ LÝ (${openList.length}) ---</div>`;
      html += `<div class="dossier-grid">` + openList.map(item => makeCard(item, false)).join("") + `</div>`;
    }
    if (doneList.length) {
      html += `<div class="inv-list-label done-label">--- HỒ SƠ ĐÃ XỬ LÝ (${doneList.length}) ---</div>`;
      html += `<div class="dossier-grid">` + doneList.map(item => makeCard(item, true)).join("") + `</div>`;
    }

    boxDossiers.innerHTML = html;
  }

  function closeContextMenu() {
    contextMenu.classList.add("hidden");
    currentDossier = null;
  }

  function showModal(title, content, actions = []) {
    modalTitle.textContent = title;
    modalContent.innerHTML = content;
    modalActions.replaceChildren();

    actions.forEach(action => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = action.label;
      if (action.className) button.className = action.className;
      button.addEventListener("click", action.onClick);
      modalActions.appendChild(button);
    });

    modal.classList.remove("hidden");
  }

  function closeModal() {
    modal.classList.add("hidden");
    modalContent.replaceChildren();
    modalActions.replaceChildren();
  }

  function findDossier(id) {
    return latestFiles.find(item => String(item.id) === String(id));
  }

  function showDetails(item) {
    if (!item) return;
    const dateText = item.time ? new Date(item.time).toLocaleString("vi-VN") : "Không có dữ liệu";
    showModal("CHI TIẾT HỒ SƠ DỊ THƯỜNG", `
      <div class="detail-row"><span>MÃ HỒ SƠ</span><strong>${escapeHTML(item.id)}</strong></div>
      <div class="detail-row"><span>TIÊU ĐỀ / VỤ VIỆC</span><strong>${escapeHTML(item.title)}</strong></div>
      <div class="detail-row"><span>ĐỊA ĐIỂM</span><strong>${escapeHTML(item.loc)}</strong></div>
      <div class="detail-row"><span>NGƯỜI LẬP</span><strong>${escapeHTML(item.author)}</strong></div>
      <div class="detail-row"><span>THỜI GIAN GHI NHẬN</span><strong>${escapeHTML(dateText)}</strong></div>
      <div class="detail-row"><span>TRẠNG THÁI</span><strong>${item.status === "done" ? "ĐÃ HOÀN TẤT" : "CHƯA XỬ LÝ"}</strong></div>
      <div class="detail-description"><span>CHI TIẾT DIỄN BIẾN</span><p>${escapeHTML(item.detail || "Không có nội dung mô tả.")}</p></div>
    `, [{ label: "ĐÓNG", className: "back", onClick: closeModal }]);
  }

  function openAddModal() {
    showModal("LẬP HỒ SƠ BÁO CÁO MỚI", `
      <div class="inv-field"><label>TIÊU ĐỀ / VỤ VIỆC (*)</label><input id="modal-input-title" type="text" placeholder="Tên hiện tượng dị thường..."></div>
      <div class="inv-field"><label>TỌA ĐỘ / TỈNH THÀNH (*)</label><input id="modal-input-loc" type="text" placeholder="VD: Hà Nội, Lâm Đồng..."></div>
      <div class="inv-field"><label>CHI TIẾT DIỄN BIẾN</label><textarea id="modal-input-detail" placeholder="Mô tả tường tận dị tượng..."></textarea></div>
      <div class="inv-field"><label>NGƯỜI LẬP (ĐẶC VỤ / NHÂN VIÊN)</label><input id="modal-input-author" type="text" placeholder="Tên hoặc mã số đặc vụ..."></div>
      <div id="modal-add-error" class="inv-error"></div>
    `, [
      { label: "GỬI LÊN HỆ THỐNG", onClick: submitNewDossier },
      { label: "HỦY", className: "back", onClick: closeModal }
    ]);
  }

  async function submitNewDossier() {
    const title = screenEl.querySelector("#modal-input-title").value.trim();
    const loc = screenEl.querySelector("#modal-input-loc").value.trim();
    const detail = screenEl.querySelector("#modal-input-detail").value.trim();
    const author = screenEl.querySelector("#modal-input-author").value.trim();
    const error = screenEl.querySelector("#modal-add-error");

    if (!title || !loc) {
      error.textContent = "VUI LÒNG NHẬP TIÊU ĐỀ VÀ ĐỊA ĐIỂM.";
      return;
    }

    const buttons = [...modalActions.querySelectorAll("button")];
    buttons.forEach(button => button.disabled = true);

    try {
      const r = await fetch(DB_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ title, loc, detail, author: author || "Ẩn danh" })
      });
      const result = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(result.error || "Không thể tạo hồ sơ mới.");
      closeModal();
      await loadFiles();
    } catch (err) {
      error.textContent = "LỖI: " + (err.message || "Không thể kết nối tổng bộ.");
      buttons.forEach(button => button.disabled = false);
    }
  }

  function editDossier(item) {
    if (!item) return;
    editingDossierId = item.id;
    showModal("CHỈNH SỬA HỒ SƠ", `
      <label class="inv-edit-label">TIÊU ĐỀ / VỤ VIỆC (*)</label><input id="edit-title" class="inv-edit-input">
      <label class="inv-edit-label">ĐỊA ĐIỂM (*)</label><input id="edit-loc" class="inv-edit-input">
      <label class="inv-edit-label">CHI TIẾT DIỄN BIẾN</label><textarea id="edit-detail" class="inv-edit-textarea"></textarea>
      <label class="inv-edit-label">NGƯỜI LẬP</label><input id="edit-author" class="inv-edit-input">
      <div id="edit-error" class="inv-error"></div>
    `, [
      { label: "LƯU THAY ĐỔI", onClick: saveEdit },
      { label: "HỦY", className: "back", onClick: () => { editingDossierId = null; closeModal(); } }
    ]);

    screenEl.querySelector("#edit-title").value = item.title || "";
    screenEl.querySelector("#edit-loc").value = item.loc || "";
    screenEl.querySelector("#edit-detail").value = item.detail || "";
    screenEl.querySelector("#edit-author").value = item.author || "";
  }

  async function saveEdit() {
    const title = screenEl.querySelector("#edit-title").value.trim();
    const loc = screenEl.querySelector("#edit-loc").value.trim();
    const detail = screenEl.querySelector("#edit-detail").value.trim();
    const author = screenEl.querySelector("#edit-author").value.trim();
    const error = screenEl.querySelector("#edit-error");

    if (!title || !loc) {
      error.textContent = "VUI LÒNG NHẬP TIÊU ĐỀ VÀ ĐỊA ĐIỂM.";
      return;
    }

    const buttons = [...modalActions.querySelectorAll("button")];
    buttons.forEach(button => button.disabled = true);

    try {
      const r = await fetch(DB_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: editingDossierId, title, loc, detail, author: author || "Ẩn danh" })
      });
      const result = await r.json();
      if (!r.ok || !result.success) throw new Error(result.error || "Không thể cập nhật hồ sơ.");
      closeModal();
      closeContextMenu();
      editingDossierId = null;
      await loadFiles();
    } catch (err) {
      error.textContent = "LỖI: " + (err.message || "Không thể lưu thay đổi.");
      buttons.forEach(button => button.disabled = false);
    }
  }

  async function deleteDossier(item) {
    if (!item) return;
    if (!confirm(`XÁC NHẬN XÓA HỒ SƠ?\n\n[${item.loc}] ${item.title}\n\nHành động này không thể hoàn tác.`)) return;

    try {
      const r = await fetch(DB_URL, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id })
      });
      const result = await r.json();
      if (!r.ok || !result.success) throw new Error(result.error || "Không thể xóa hồ sơ.");
      closeContextMenu();
      closeModal();
      await loadFiles();
    } catch (err) {
      alert("LỖI XÓA HỒ SƠ: " + (err.message || "Không thể kết nối tổng bộ."));
    }
  }

  screenEl.querySelector("#btn-open-add").addEventListener("click", openAddModal);

  boxDossiers.addEventListener("click", event => {
    const card = event.target.closest(".dossier-card");
    if (!card) return;
    closeContextMenu();
    showDetails(findDossier(card.dataset.id));
  });

  boxDossiers.addEventListener("contextmenu", event => {
    const card = event.target.closest(".dossier-card");
    if (!card) return;
    event.preventDefault();
    const item = findDossier(card.dataset.id);
    if (!item) return;
    currentDossier = item;
    contextMenu.classList.remove("hidden");
    contextMenu.style.left = Math.max(8, Math.min(event.clientX, innerWidth - 188)) + "px";
    contextMenu.style.top = Math.max(8, Math.min(event.clientY, innerHeight - 102)) + "px";
  });

  contextMenu.addEventListener("click", event => {
    const action = event.target.closest("[data-action]")?.dataset.action;
    if (!action || !currentDossier) return;
    const item = currentDossier;
    closeContextMenu();
    if (action === "edit") editDossier(item);
    if (action === "delete") deleteDossier(item);
  });

  screenEl.addEventListener("click", event => {
    if (!event.target.closest("#dossier-context-menu")) closeContextMenu();
  });

  screenEl.querySelector("#dossier-modal-close").addEventListener("click", closeModal);
  modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
  screenEl.querySelector("#btn-refresh").addEventListener("click", loadFiles);

  initTeamsDOM();
  await loadFiles();

  pollInterval = setInterval(() => { if (!document.hidden) loadFiles(); }, 12000);
  teamInterval = setInterval(updateTeamsIndependent, 5000);

  screenEl.querySelector(".back").addEventListener("click", () => {
    if (busy) return;
    transition(() => {
      clearInterval(pollInterval);
      clearInterval(teamInterval);
      window.removeEventListener("mousemove", doResize);
      window.removeEventListener("touchmove", doResize);
      window.removeEventListener("mouseup", stopResize);
      window.removeEventListener("touchend", stopResize);
      pauseGlitch = false;
      closeContextMenu();
      closeModal();
      screenEl.remove();
      render("dept");
    });
  });
});

function goCustomScreen(screenEl) {
  Object.values(screens).forEach(s => s.classList.add("hidden"));
  screenEl.classList.remove("hidden");
}

$("dept-logistics").addEventListener("click",()=>alert("Đã vào: Cục Hậu Cần"));
$("dept-security").addEventListener("click",()=>alert("Đã vào: Cục Bảo Mật"));

applyLang();boot();
</script>
</body>
</html>
